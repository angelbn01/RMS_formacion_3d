<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu primer día en Rodi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css?v=4">
</head>
<body>
  <!-- Barra superior -->
  <header class="barra">
    <div class="marca">
      <span class="marca-rodi">RODI</span>
      <span class="marca-sub">MOTOR SERVICES</span>
    </div>
    <div class="barra-titulo">
      <strong id="titulo-curso">Formación</strong>
      <span id="subtitulo-curso"></span>
    </div>
    <div class="barra-progreso" aria-label="Progreso">
      <div class="progreso-pista"><div class="progreso-relleno" id="progreso-relleno"></div></div>
      <span id="progreso-texto">0/7 zonas</span>
    </div>
    <button class="boton-texto" id="boton-vista-general" type="button">Vista general</button>
  </header>

  <!-- Escena 3D -->
  <main class="escena">
    <canvas id="lienzo-3d"></canvas>
    <div class="cargando" id="cargando">
      <div class="spinner"></div>
      <p>Cargando el taller 3D…</p>
    </div>
    <div class="aviso-escena" id="aviso-escena" hidden></div>
    <div class="controles-3d" id="controles-3d">
      <button type="button" data-control="acercar" title="Acercar" aria-label="Acercar">+</button>
      <button type="button" data-control="alejar" title="Alejar" aria-label="Alejar">−</button>
      <button type="button" data-control="centrar" title="Centrar la vista" aria-label="Centrar la vista">⌖</button>
    </div>
    <div class="ayuda-3d">
      <span class="solo-raton">Arrastra para girar · Rueda: zoom · Clic derecho: mover</span>
      <span class="solo-tactil">1 dedo: girar · 2 dedos: zoom y mover</span>
    </div>
  </main>

  <!-- Panel lateral: aquí se pintan bienvenida, pasos, preguntas y resultados -->
  <aside class="panel" id="panel" aria-live="polite"></aside>

  <!-- Navegación por zonas -->
  <nav class="zonas" id="zonas" aria-label="Zonas de la formación"></nav>

  <script src="js/config.js?v=4"></script>
  <script src="js/contenido.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
</body>
</html>
